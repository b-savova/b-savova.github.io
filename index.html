---
layout: default
---

<main class="home">

  <section class="hero">

    <img
      class="hero-image"
      src="{{ '/assets/images/life_form_4.jpg' | relative_url }}"
      alt="Artwork by Boriana Savova"
    >

    <div class="hero-overlay"></div>

    <div class="hero-content">
      <h1>Boriana Savova</h1>
      <p>Artist</p>
    </div>

    <a href="#selected-works" class="hero-scroll" aria-label="Scroll to selected works">
      <span>Scroll</span>
      <span class="hero-arrow">↓</span>
    </a>

  </section>


  <section class="intro">
    <p>
      Contemporary artist working across drawing, painting,
      installation and moving image.
    </p>
  </section>


  <section class="featured" id="selected-works">

    <h2>Selected Works</h2>

    <div class="work-grid">

      {% for artwork in site.artworks limit:6 %}

  <a
    href="{{ artwork.image | relative_url }}"
    class="work lightbox-item"
    data-title="{{ artwork.title }}"
    data-year="{{ artwork.year }}"
    data-description="{{ artwork.description | escape }}"
  >

    <img
      src="{{ artwork.image | relative_url }}"
      alt="{{ artwork.title }}"
      loading="eager"
      decoding="async"
    >

    <div class="work-hover-info">
      <span>{{ artwork.title }}</span>
      <span>{{ artwork.year }}</span>
    </div>

  </a>

{% endfor %}

    </div>

  </section>

</main>
